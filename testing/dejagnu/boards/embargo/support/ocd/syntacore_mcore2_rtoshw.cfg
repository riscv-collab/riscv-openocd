proc ocd_test_target_configuration_hook {} {
}

proc init_targets {} {
	jtag newtap core0 cpu -irlen 5
	jtag newtap core1 cpu -irlen 5

	target create core0.cpu riscv -endian little -chain-position core0.cpu
	core0.cpu configure -rtos hwthread

	target create core1.cpu riscv -endian little -chain-position core1.cpu
	core1.cpu configure -rtos hwthread

	foreach tgt_name [target names] {
		$tgt_name configure -event examine-fail {
			echo "ERROR: TARGET [target current] EXAMINATION FAILURE"
			shutdown error
		}
	}

	ocd_test_target_configuration_hook
}

gdb_report_register_access_error enable
gdb_report_data_abort enable
