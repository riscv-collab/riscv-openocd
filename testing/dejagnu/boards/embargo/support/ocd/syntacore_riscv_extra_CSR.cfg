proc ocd_test_target_configuration_hook {} {
}

proc init_targets {} {
	set _CHIPNAME riscv
	jtag newtap $_CHIPNAME cpu -irlen 5

	set _TARGETNAME $_CHIPNAME.cpu
	target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME
	# 928 - CSR_PMPCFG0 - some renamed (existing) register
	# 2047 - some unallocated register, but renamed (non-default name)
	# 2048 - some unallocated register
	# 0x801 - 2049, some unallocateed register, address in hex, but renamed
	# 0x802 - 2050, some unallocateed register, address in hex
	$_TARGETNAME riscv expose_csrs 928=invalid_rename, 2047=some_register, 2048, 0x801=some_register_hex, 0x802

	foreach tgt_name [target names] {
		$tgt_name configure -event examine-fail {
			echo "ERROR: TARGET [target current] EXAMINATION FAILURE"
			shutdown error
		}
	}

	ocd_test_target_configuration_hook
}

gdb report_register_access_error enable
gdb report_data_abort enable
