proc init_targets {} {
	adapter speed 2000
	reset_config trst_and_srst

	jtag newtap scr7_core3 cpu -irlen 5
	jtag newtap scr7_core2 cpu -irlen 5
	jtag newtap scr7_core1 cpu -irlen 5
	jtag newtap scr7_core0 cpu -irlen 5

	target create scr7_core3.cpu riscv -endian little -chain-position scr7_core3.cpu -coreid 3
	scr7_core3.cpu configure -work-area-phys 0x3ff0000 -work-area-size 0x10000 -work-area-backup 1

	target create scr7_core2.cpu riscv -endian little -chain-position scr7_core2.cpu -coreid 2
	scr7_core2.cpu configure -work-area-phys 0x3fe0000 -work-area-size 0x10000 -work-area-backup 1

	target create scr7_core1.cpu riscv -endian little -chain-position scr7_core1.cpu -coreid 1
	scr7_core1.cpu configure -work-area-phys 0x3fd0000 -work-area-size 0x10000 -work-area-backup 1

	target create scr7_core0.cpu riscv -endian little -chain-position scr7_core0.cpu -coreid 0
	scr7_core0.cpu configure -work-area-phys 0x3fc0000 -work-area-size 0x10000 -work-area-backup 1
}

