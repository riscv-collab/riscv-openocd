adapter speed 2000

proc init_targets {} {
	jtag newtap scr7_core0 cpu -irlen 5
	jtag newtap scr7_core1 cpu -irlen 5

	target create scr7_core0.cpu riscv -endian little -chain-position scr7_core0.cpu -coreid 0
	scr7_core0.cpu configure -work-area-phys 0x3fd0000 -work-area-size 0x10000 -work-area-backup 1

	target create scr7_core1.cpu riscv -endian little -chain-position scr7_core1.cpu -coreid 1
	scr7_core1.cpu configure -work-area-phys 0x3fc0000 -work-area-size 0x10000 -work-area-backup 1
}

gdb_report_register_access_error enable
gdb_report_data_abort enable
