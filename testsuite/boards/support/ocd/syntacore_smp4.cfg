proc ocd_test_target_configuration_hook {} {
}

proc init_targets {} {
	jtag newtap core3 cpu -irlen 5
	jtag newtap core2 cpu -irlen 5
	jtag newtap core1 cpu -irlen 5
	jtag newtap core0 cpu -irlen 5

	target create core3.cpu riscv -endian little -chain-position core3.cpu -coreid 3
	core3.cpu configure -rtos hwthread

	target create core2.cpu riscv -endian little -chain-position core2.cpu -coreid 2
	core2.cpu configure -rtos hwthread

	target create core1.cpu riscv -endian little -chain-position core1.cpu -coreid 1
	core1.cpu configure -rtos hwthread

	target create core0.cpu riscv -endian little -chain-position core0.cpu -coreid 0
	core0.cpu configure -rtos hwthread

	target smp core0.cpu core1.cpu core2.cpu core3.cpu

	foreach tgt_name [target names] {
		$tgt_name configure -event examine-fail {
			echo "ERROR: TARGET [target current] EXAMINATION FAILURE"
			shutdown error
		}
	}

	ocd_test_target_configuration_hook
}
