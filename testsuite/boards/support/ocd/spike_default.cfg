proc proc_exists { p } {
	return [expr {[llength [info procs $p]] > 0}]
}

proc ocd_test_target_configuration_hook {} {
}

proc init_targets {} {
	set _CHIPNAME riscv
	jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10e31913

	set _TARGETNAME $_CHIPNAME.cpu
	target create $_TARGETNAME riscv -chain-position $_TARGETNAME

	if { [proc_exists sc_target_ide_csr_cloak] == 1 } {
		$_TARGETNAME riscv hide_csrs [sc_target_ide_csr_cloak]
	}

	foreach tgt_name [target names] {
		$tgt_name configure -event examine-fail {
			echo "ERROR: TARGET [target current] EXAMINATION FAILURE"
			shutdown error
		}
	}

	ocd_test_target_configuration_hook
}

gdb report_register_access_error enable
gdb report_data_abort enable
